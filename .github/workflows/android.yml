name: Android APK

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android:
    name: Проверка учебника и сборка APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Получить исходный код
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Установить Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: npm
      - name: Проверить текст, формулы и офлайн-ресурсы
        run: |
          npm ci --no-audit --no-fund
          npm test
      - name: Установить Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Настроить Gradle
        uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4.4.3
      - name: Проверить наличие постоянного ключа
        id: signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$KEYSTORE_BASE64" && -n "$KEYSTORE_PASSWORD" ]]; then
            umask 077
            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/mathemat-release.p12"
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          elif [[ -n "$KEYSTORE_BASE64" || -n "$KEYSTORE_PASSWORD" ]]; then
            echo '::error::Настроены не все секреты подписи. Нужны ANDROID_KEYSTORE_BASE64 и ANDROID_KEYSTORE_PASSWORD.'
            exit 1
          else
            echo '::warning::Постоянный ключ не настроен: будет создана только предварительная debug-сборка с другим applicationId. Она не обновляет release-версию.'
            echo 'configured=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Собрать подписанный release APK
        if: steps.signing.outputs.configured == 'true'
        env:
          MATHEMAT_KEYSTORE_PATH: ${{ runner.temp }}/mathemat-release.p12
          MATHEMAT_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease -PappVersionCode="$GITHUB_RUN_NUMBER"
      - name: Проверить неизменность сертификата release
        if: steps.signing.outputs.configured == 'true'
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > "$RUNNER_TEMP/signature.txt"
          ACTUAL="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/signature.txt" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="$(tr -d ':[:space:]' < signing-cert.sha256 | tr '[:upper:]' '[:lower:]')"
          if [[ -z "$ACTUAL" || "$ACTUAL" != "$EXPECTED" ]]; then
            echo '::error::Сертификат подписи не совпадает с закреплённым. Выпуск отменён, чтобы не сломать обновления.'
            exit 1
          fi
          echo "Release signature verified: SHA-256 $ACTUAL"
      - name: Сохранить подписанный release APK
        if: steps.signing.outputs.configured == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: predel-release-signed
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 90
      - name: Собрать предварительный APK без постоянной подписи
        if: steps.signing.outputs.configured == 'false'
        run: ./gradlew --no-daemon :app:assembleDebug -PappVersionCode="$GITHUB_RUN_NUMBER"
      - name: Сохранить предварительный APK
        if: steps.signing.outputs.configured == 'false'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: predel-preview-not-updatable-to-release
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Удалить временную копию ключа
        if: always()
        run: rm -f "$RUNNER_TEMP/mathemat-release.p12"
